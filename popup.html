<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f1a;
      color: #eee;
      padding: 20px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .header img {
      width: 24px;
      height: 24px;
    }
    h1 {
      font-size: 15px;
      color: #a5b4fc;
    }
    .subtitle {
      text-align: center;
      font-size: 11px;
      color: #6b7280;
      margin-bottom: 16px;
    }
    .stats {
      background: #1a1a2e;
      border: 1px solid #2d2d44;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .stat {
      text-align: center;
    }
    .stat-value {
      font-size: 22px;
      font-weight: 700;
      color: #818cf8;
    }
    .stat-label {
      font-size: 10px;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .status {
      text-align: center;
      margin-bottom: 16px;
      font-size: 13px;
    }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }
    .status-dot.idle { background: #6b7280; }
    .status-dot.recording { background: #ef4444; animation: pulse 1s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .btn-group {
      display: flex;
      gap: 8px;
    }
    button {
      flex: 1;
      padding: 10px 0;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    #startBtn {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
    }
    #stopBtn {
      background: #1e1e36;
      border: 1px solid #3b3b5c;
      color: #c4b5fd;
    }
    #startBtn:hover:not(:disabled) { opacity: 0.85; }
    #stopBtn:hover:not(:disabled) { background: #2a2a42; }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/logo.png" alt="CopyCat">
    <h1>SOP Mapper</h1>
  </div>
  <p class="subtitle">Record interactions & network requests</p>

  <div class="status">
    <span class="status-dot idle" id="statusDot"></span>
    <span id="statusText">Idle</span>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-value" id="xhrCount">0</div>
      <div class="stat-label">XHR / Fetch</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="navCount">0</div>
      <div class="stat-label">Navigations</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="clickCount">0</div>
      <div class="stat-label">Clicks</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="inputCount">0</div>
      <div class="stat-label">Inputs</div>
    </div>
  </div>

  <div class="btn-group">
    <button id="startBtn">Start Recording</button>
    <button id="stopBtn" disabled>Stop & Download</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
